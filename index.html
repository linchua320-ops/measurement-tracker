<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="丈量排程">
<meta name="theme-color" content="#f7f3ee">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<title>丈量排程</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap');
:root {
  --bg:#f7f3ee; --surface:#ffffff; --sur2:#f0ebe3; --border:#e5ddd3;
  --text:#1a1208; --text2:#5c4a35; --text3:#a8917a;
  --accent:#3058a0; --acc2:#1f3f7a;
  --red:#b83232; --green:#2e7a50; --blue:#3058a0; --amber:#8a5a10; --violet:#6b4fa0; --orange:#c2650c;
  --rcard:22px; --rbtn:14px; --rchip:100px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:'Noto Sans TC',-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;min-height:-webkit-fill-available;overflow-x:hidden;}
.header{position:sticky;top:0;z-index:100;background:rgba(247,243,238,0.95);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);padding:env(safe-area-inset-top,0) 0 0;}
.hinner{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 10px;max-width:900px;margin:0 auto;}
.logo-title{font-size:27px;font-weight:900;letter-spacing:-0.5px;line-height:1;}
.logo-sub{font-size:10px;color:var(--text3);font-weight:400;letter-spacing:1px;margin-top:2px;}
.hbtns{display:flex;gap:8px;align-items:center;}
.add-btn{width:40px;height:40px;border-radius:var(--rbtn);background:var(--accent);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#fff;font-size:24px;font-weight:300;line-height:1;box-shadow:0 2px 10px rgba(48,88,160,0.25);}
.add-btn:active{transform:scale(0.88);opacity:0.85;}
.view-toggle{display:flex;background:var(--sur2);border-radius:10px;padding:3px;gap:2px;}
.vtbtn{padding:5px 10px;border-radius:8px;border:none;background:transparent;cursor:pointer;font-size:14px;}
.vtbtn.active{background:var(--surface);box-shadow:0 1px 4px rgba(0,0,0,0.1);}
.gcal-btn{display:flex;align-items:center;gap:5px;background:var(--sur2);border:1px solid var(--border);border-radius:var(--rchip);padding:5px 12px;font-size:11px;font-weight:600;color:var(--text2);cursor:pointer;}
.gcal-btn.on{background:rgba(46,122,80,0.12);color:var(--green);border-color:transparent;}
.stats-row{display:flex;gap:8px;padding:4px 20px 8px;overflow-x:auto;scrollbar-width:none;max-width:900px;margin:0 auto;}
.stats-row::-webkit-scrollbar{display:none;}
.spill{flex-shrink:0;display:flex;align-items:baseline;gap:4px;background:var(--surface);border:1px solid var(--border);border-radius:var(--rchip);padding:5px 13px;white-space:nowrap;}
.spill .n{font-size:15px;font-weight:700;}
.spill .l{font-size:11px;color:var(--text3);}
.hdivider{height:1px;background:var(--border);margin:0 20px;max-width:860px;margin-left:auto;margin-right:auto;}
.list{padding:14px 16px 110px;max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:12px;}
.section-head{display:flex;align-items:center;gap:10px;padding:4px 0 2px;}
.section-head-title{font-size:13px;font-weight:700;color:var(--text3);letter-spacing:0.8px;text-transform:uppercase;}
.section-divider{flex:1;height:1px;background:var(--border);}
.card{background:var(--surface);border-radius:var(--rcard);overflow:hidden;box-shadow:0 1px 3px rgba(60,30,10,0.07),0 4px 14px rgba(60,30,10,0.05);position:relative;}
.card.done-card{opacity:0.7;}
.cstripe{height:3px;background:var(--border);}
.card.scheduled .cstripe{background:var(--blue);}
.card.done-card .cstripe{background:var(--green);}
.ctop{display:flex;align-items:flex-start;justify-content:space-between;padding:16px 16px 8px;gap:10px;}
.cleft{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;}
.cname{font-size:17px;font-weight:700;line-height:1.25;}
.card.done-card .cname{text-decoration:line-through;color:var(--text3);}
.cchips{display:flex;flex-wrap:wrap;gap:5px;}
.chip{display:inline-flex;align-items:center;font-size:11px;font-weight:600;padding:3px 9px;border-radius:var(--rchip);letter-spacing:0.2px;}
.ch-待安排{background:rgba(138,90,16,0.12);color:var(--amber);}
.ch-已排定{background:rgba(48,88,160,0.10);color:var(--blue);}
.ch-已完成{background:rgba(46,122,80,0.12);color:var(--green);}
.ch-install{background:rgba(107,79,160,0.12);color:var(--violet);}
.ch-payment{background:rgba(194,101,12,0.12);color:var(--orange);}
.ch-overdue{background:rgba(184,50,50,0.14);color:var(--red);font-weight:700;}
.photo-grid{display:flex;flex-wrap:wrap;gap:8px;}
.photo-thumb{position:relative;width:60px;height:60px;border-radius:10px;overflow:hidden;border:1px solid var(--border);flex-shrink:0;}
.photo-thumb img{width:100%;height:100%;object-fit:cover;display:block;cursor:pointer;}
.photo-thumb .rm{position:absolute;top:2px;right:2px;width:18px;height:18px;border-radius:50%;background:rgba(0,0,0,0.6);color:#fff;border:none;font-size:11px;display:flex;align-items:center;justify-content:center;cursor:pointer;line-height:1;}
.photo-add{width:60px;height:60px;border-radius:10px;border:1.5px dashed var(--border);background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--text3);cursor:pointer;flex-shrink:0;}
.card-photos{display:flex;flex-direction:column;gap:8px;}
.card-photo-cat{display:flex;flex-direction:column;gap:4px;}
.card-photo-row{display:flex;gap:6px;flex-wrap:wrap;}
.card-photo-row img{width:44px;height:44px;object-fit:cover;border-radius:8px;cursor:pointer;border:1px solid var(--border);}
.checkrow{display:flex;align-items:center;gap:8px;padding-top:22px;}
.checkrow input{width:18px;height:18px;accent-color:var(--accent);}
.checkrow label{font-size:13px;font-weight:600;color:var(--text2);}
.cacts{display:flex;gap:6px;flex-shrink:0;padding-top:2px;}
.actbtn{width:34px;height:34px;border-radius:12px;background:var(--sur2);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px;}
.actbtn:active{background:var(--border);}
.done-btn{background:rgba(46,122,80,0.12);font-size:16px;}
.cbody{padding:0 16px 14px;display:flex;flex-direction:column;gap:8px;}
.irow{display:grid;grid-template-columns:1fr 1fr;gap:8px 16px;}
.icell{display:flex;flex-direction:column;gap:2px;}
.ilbl{font-size:10px;font-weight:500;color:var(--text3);letter-spacing:0.6px;text-transform:uppercase;}
.ival{font-size:13px;font-weight:500;color:var(--text2);}
.addr-row{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.addr-row .ival{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.noteblock{background:rgba(48,88,160,0.06);border-radius:10px;padding:9px 11px;font-size:12px;font-weight:300;color:var(--text2);line-height:1.65;}
.cfoot{display:flex;align-items:center;justify-content:space-between;padding:9px 16px;border-top:1px solid var(--border);}
.fuser,.ftime{font-size:11px;color:var(--text3);}
/* CALENDAR */
.cal-wrap{padding:14px 16px 110px;max-width:900px;margin:0 auto;}
.cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.cal-title{font-size:20px;font-weight:800;}
.cal-nav{width:36px;height:36px;border-radius:12px;background:var(--surface);border:1px solid var(--border);cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;color:var(--text2);}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:20px;}
.cal-dow{text-align:center;font-size:11px;font-weight:600;color:var(--text3);padding:4px 0 8px;}
.cal-day{aspect-ratio:1;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:5px;cursor:pointer;position:relative;overflow:hidden;}
.cal-day:hover{background:var(--sur2);}
.cal-day.today{background:var(--accent);}
.cal-day.today .cal-dn{color:#fff;font-weight:700;}
.cal-day.other-month .cal-dn{color:var(--text3);}
.cal-dn{font-size:13px;font-weight:500;line-height:1;}
.cal-dots{display:flex;gap:2px;justify-content:center;margin-top:3px;}
.cal-dot{width:5px;height:5px;border-radius:50%;background:var(--blue);}
.cal-mini-list{display:flex;flex-direction:column;align-items:center;gap:0px;margin-top:2px;width:100%;overflow:hidden;}
.cal-ev-mini{font-size:8.5px;font-weight:700;line-height:1.25;white-space:nowrap;}
.cal-events{display:flex;flex-direction:column;gap:8px;}
.cal-ev-head{font-size:12px;font-weight:700;color:var(--text3);letter-spacing:0.6px;text-transform:uppercase;padding:8px 0 4px;}
.cal-ev-card{background:var(--surface);border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:12px;box-shadow:0 1px 3px rgba(60,30,10,0.06);}
.cal-ev-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;background:var(--blue);}
.cal-ev-info{flex:1;min-width:0;}
.cal-ev-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cal-ev-sub{font-size:11px;color:var(--text3);margin-top:2px;}
.cal-ev-date{font-size:12px;font-weight:600;color:var(--text2);flex-shrink:0;}
/* MODAL */
.overlay{position:fixed;inset:0;z-index:200;background:rgba(26,18,8,0.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity 0.22s;}
.overlay.open{opacity:1;pointer-events:all;}
.modal{width:100%;max-width:560px;background:var(--bg);border-radius:28px 28px 0 0;padding-bottom:env(safe-area-inset-bottom,20px);transform:translateY(100%);transition:transform 0.32s cubic-bezier(0.32,0.72,0,1);max-height:93vh;overflow-y:auto;}
.overlay.open .modal{transform:translateY(0);}
.mhandle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:14px auto 0;}
.mhead{display:flex;align-items:center;justify-content:space-between;padding:16px 22px 6px;}
.mhead-title{font-size:20px;font-weight:800;letter-spacing:-0.3px;}
.mclose{width:30px;height:30px;border-radius:50%;background:var(--sur2);border:none;cursor:pointer;font-size:15px;color:var(--text2);display:flex;align-items:center;justify-content:center;}
.form{padding:10px 22px 24px;display:flex;flex-direction:column;gap:16px;}
.fgrp{display:flex;flex-direction:column;gap:6px;}
.flbl{font-size:11px;font-weight:700;color:var(--text3);letter-spacing:0.7px;text-transform:uppercase;}
.finput,.fselect,.ftextarea{background:var(--surface);border:1.5px solid var(--border);border-radius:14px;color:var(--text);padding:12px 14px;font-size:15px;font-family:inherit;outline:none;width:100%;-webkit-appearance:none;appearance:none;}
.finput:focus,.fselect:focus,.ftextarea:focus{border-color:var(--accent);}
.ftextarea{resize:none;min-height:76px;line-height:1.55;}
.fgrow2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.savebtn{width:100%;padding:15px;border-radius:16px;background:var(--accent);border:none;color:#fff;font-size:16px;font-weight:800;font-family:inherit;cursor:pointer;box-shadow:0 4px 18px rgba(48,88,160,0.28);}
.savebtn:active{transform:scale(0.97);opacity:0.9;}
.gcal-row{display:flex;align-items:center;justify-content:space-between;background:rgba(48,88,160,0.06);border:1px solid rgba(48,88,160,0.18);border-radius:14px;padding:12px 14px;font-size:13px;color:var(--text2);}
.toggle{width:50px;height:28px;background:var(--border);border-radius:14px;position:relative;cursor:pointer;border:none;flex-shrink:0;}
.toggle.on{background:var(--accent);}
.toggle::after{content:'';position:absolute;width:22px;height:22px;background:#fff;border-radius:50%;top:3px;left:3px;transition:transform 0.22s;}
.toggle.on::after{transform:translateX(22px);}
/* DAY PANEL */
.day-overlay{position:fixed;inset:0;z-index:200;background:rgba(26,18,8,0.45);backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity 0.22s;}
.day-overlay.open{opacity:1;pointer-events:all;}
.day-panel{width:100%;max-width:560px;background:var(--bg);border-radius:28px 28px 0 0;padding-bottom:env(safe-area-inset-bottom,24px);transform:translateY(100%);transition:transform 0.32s cubic-bezier(0.32,0.72,0,1);max-height:80vh;overflow-y:auto;}
.day-overlay.open .day-panel{transform:translateY(0);}
.day-handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:14px auto 0;}
.day-head{display:flex;align-items:center;justify-content:space-between;padding:14px 22px 10px;}
.day-head-title{font-size:18px;font-weight:800;}
.day-head-close{width:30px;height:30px;border-radius:50%;background:var(--sur2);border:none;cursor:pointer;font-size:15px;color:var(--text2);display:flex;align-items:center;justify-content:center;}
.day-list{display:flex;flex-direction:column;gap:10px;padding:4px 16px 10px;}
.day-item{background:var(--surface);border-radius:18px;overflow:hidden;box-shadow:0 1px 3px rgba(60,30,10,0.07);}
.day-item-stripe{height:3px;background:var(--blue);}
.day-item-body{padding:13px 15px 12px;display:flex;flex-direction:column;gap:7px;}
.day-item-time{font-size:13px;font-weight:800;color:var(--accent);}
.day-item-name{font-size:16px;font-weight:700;line-height:1.25;}
.day-item-chips{display:flex;flex-wrap:wrap;gap:5px;}
.day-item-meta{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;}
.day-item-cell{display:flex;flex-direction:column;gap:1px;}
.day-item-lbl{font-size:10px;font-weight:500;color:var(--text3);letter-spacing:0.5px;text-transform:uppercase;}
.day-item-val{font-size:12px;font-weight:500;color:var(--text2);}
.day-item-note{font-size:12px;color:var(--text2);background:rgba(48,88,160,0.06);border-radius:8px;padding:7px 10px;line-height:1.6;}
.day-item-editbtn{align-self:flex-end;padding:5px 14px;border-radius:var(--rchip);background:var(--sur2);border:none;font-size:12px;font-weight:600;color:var(--accent);cursor:pointer;font-family:inherit;}
.day-empty{text-align:center;padding:30px 20px;color:var(--text3);font-size:14px;}
.empty{text-align:center;padding:70px 20px;color:var(--text3);}
.eico{font-size:52px;margin-bottom:14px;}
.etxt{font-size:15px;font-weight:300;line-height:1.7;}
.toast{position:fixed;bottom:calc(88px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%) translateY(14px);background:var(--text);color:#fff;padding:10px 20px;border-radius:var(--rchip);font-size:13px;font-weight:500;z-index:400;opacity:0;pointer-events:none;transition:opacity 0.18s,transform 0.18s;white-space:nowrap;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.login-screen{position:fixed;inset:0;z-index:999;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:32px 24px;}
.login-box{width:100%;max-width:360px;display:flex;flex-direction:column;align-items:center;gap:28px;}
.login-icon{font-size:56px;line-height:1;}
.login-title{font-size:28px;font-weight:900;letter-spacing:-0.5px;text-align:center;}
.login-sub{font-size:14px;color:var(--text3);text-align:center;line-height:1.6;margin-top:-16px;}
.login-form{width:100%;display:flex;flex-direction:column;gap:12px;}
.login-input{width:100%;background:var(--surface);border:1.5px solid var(--border);border-radius:16px;color:var(--text);padding:14px 16px;font-size:16px;font-family:inherit;outline:none;text-align:center;}
.login-input:focus{border-color:var(--accent);}
.login-btn{width:100%;padding:15px;border-radius:16px;background:var(--accent);border:none;color:#fff;font-size:16px;font-weight:800;font-family:inherit;cursor:pointer;box-shadow:0 4px 18px rgba(48,88,160,0.28);}
.user-badge{display:flex;align-items:center;gap:6px;background:var(--sur2);border:1px solid var(--border);border-radius:var(--rchip);padding:5px 12px;font-size:12px;font-weight:600;color:var(--text2);cursor:pointer;max-width:100px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;}
.setup-banner{margin:0 20px 8px;max-width:860px;margin-left:auto;margin-right:auto;background:rgba(184,50,50,0.08);border:1px solid rgba(184,50,50,0.25);border-radius:14px;padding:10px 14px;font-size:12px;color:var(--red);line-height:1.6;}
</style>
</head>
<body>

<div class="login-screen" id="loginScreen">
  <div class="login-box">
    <div class="login-icon">📐</div>
    <div class="login-title">丈量排程</div>
    <div class="login-sub">請輸入您的名稱<br>首次登入後將自動記住</div>
    <div class="login-form">
      <input class="login-input" id="loginInput" type="text" placeholder="輸入您的名稱" maxlength="20" autocomplete="off">
      <button class="login-btn" onclick="doLogin()">進入</button>
    </div>
  </div>
</div>

<header class="header">
  <div class="hinner">
    <div>
      <div class="logo-title">丈量排程</div>
      <div class="logo-sub">MEASUREMENT SCHEDULE</div>
    </div>
    <div id="userBadge" class="user-badge" onclick="switchUser()" style="display:none">👤 <span id="userBadgeName"></span></div>
    <div class="hbtns">
      <button class="gcal-btn" id="gcalBtn" onclick="connectGoogleCalendar()">📆 連接日曆</button>
      <div class="view-toggle">
        <button class="vtbtn active" id="vt-list" onclick="switchView('list')">☰</button>
        <button class="vtbtn" id="vt-cal" onclick="switchView('cal')">📅</button>
      </div>
      <button class="add-btn" onclick="openModal()">＋</button>
    </div>
  </div>
  <div class="stats-row" id="statsBar"></div>
  <div id="setupBanner"></div>
  <div class="hdivider"></div>
</header>

<main class="list" id="listView"></main>

<div class="cal-wrap" id="calView" style="display:none">
  <div class="cal-header">
    <button class="cal-nav" onclick="calPrev()">‹</button>
    <div class="cal-title" id="calTitle"></div>
    <button class="cal-nav" onclick="calNext()">›</button>
  </div>
  <div class="cal-grid" id="calGrid"></div>
  <div class="cal-events" id="calEvents"></div>
</div>

<div class="toast" id="toast"></div>

<div class="day-overlay" id="dayOverlay" onclick="closeDayPanel(event)">
  <div class="day-panel" id="dayPanel">
    <div class="day-handle"></div>
    <div class="day-head">
      <span class="day-head-title" id="dayPanelTitle"></span>
      <button class="day-head-close" onclick="closeDayPanel()">✕</button>
    </div>
    <div class="day-list" id="dayPanelList"></div>
  </div>
</div>

<div class="overlay" id="modalOverlay">
  <div class="modal">
    <div class="mhandle"></div>
    <div class="mhead">
      <span class="mhead-title" id="modalTitle">新增待丈量區</span>
      <button class="mclose" onclick="closeModal()">✕</button>
    </div>
    <div class="form">
      <div class="fgrp">
        <label class="flbl">案場 / 客戶名稱 *</label>
        <input class="finput" id="f_name" type="text" placeholder="輸入名稱">
      </div>
      <div class="fgrp">
        <label class="flbl">地址</label>
        <div style="display:flex;gap:8px;">
          <input class="finput" id="f_address" type="text" placeholder="輸入地址" style="flex:1;">
          <button type="button" class="actbtn" style="width:48px;height:48px;border-radius:14px;flex-shrink:0;" title="開啟導航" onclick="openNav(document.getElementById('f_address').value)">🧭</button>
        </div>
      </div>
      <div class="fgrow2">
        <div class="fgrp">
          <label class="flbl">狀態</label>
          <select class="fselect" id="f_status" onchange="onStatusChange()">
            <option value="待安排">待安排</option>
            <option value="已排定">已排定</option>
            <option value="已完成">已完成</option>
          </select>
        </div>
        <div class="fgrp">
          <label class="flbl">負責人</label>
          <input class="finput" id="f_owner" type="text" placeholder="姓名">
        </div>
      </div>
      <div class="fgrow2" id="scheduleRow">
        <div class="fgrp">
          <label class="flbl">丈量日期</label>
          <input class="finput" id="f_date" type="date">
        </div>
        <div class="fgrp">
          <label class="flbl">丈量時間</label>
          <input class="finput" id="f_time" type="time">
        </div>

function compressImage(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        const maxW=1280;
        const scale=Math.min(1, maxW/img.width);
        const w=Math.round(img.width*scale)||1, h=Math.round(img.height*scale)||1;
        const canvas=document.createElement('canvas');
        canvas.width=w; canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg',0.72));
      };
      img.onerror=()=>reject(new Error('image load failed'));
      img.src=e.target.result;
    };
    reader.onerror=()=>reject(new Error('file read failed'));
    reader.readAsDataURL(file);
  });
}

window.handlePhotoSelect=async(e,key)=>{
  const files=Array.from(e.target.files||[]);
  e.target.value='';

    try{ const dataUrl=await compressImage(f); draftPhotos[key].push(dataUrl); }
    catch{ toast('⚠️ 有一張圖片處理失敗'); }
  }
  renderPhotoGrid(key);
};

window.viewPhoto=(id,key,i)=>{ const src=itemsMap[id]?.[key]?.[i]; if(src) openImage(src); };

window.openImage=(dataUrl)=>{
  if(!dataUrl) return;
  try{
    const [meta,b64]=dataUrl.split(',');
    const mime=meta.match(/:(.*?);/)[1];
    const bin=atob(b64);
    const arr=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
    window.open(URL.createObjectURL(new Blob([arr],{type:mime})),'_blank');
  }catch{ window.open(dataUrl,'_blank'); }
};

// ── login (id is derived from the name itself, so the same name always maps
//    to the same storage path — this is what makes phone/computer sync work) ──
function nameToId(name){
  let h=5381;
  for(let i=0;i<name.length;i++){ h=((h*33)^name.charCodeAt(i))>>>0; }
  return 'u_'+h.toString(36);
}
function doLogin(){
  const name=document.getElementById('loginInput').value.trim();
  if(!name){ document.getElementById('loginInput').focus(); return; }
  const uid=nameToId(name);
  localStorage.setItem('meastracker_uid', uid);
  localStorage.setItem('meastracker_uname', name);
  startApp(uid, name);
}
window.doLogin=doLogin;
document.getElementById('loginInput').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });

function startApp(uid, name){
  currentUserId=uid; currentUserName=name;
  document.getElementById('loginScreen').style.display='none';
  document.getElementById('userBadge').style.display='flex';
  document.getElementById('userBadgeName').textContent=name;
  if(!FIREBASE_READY){ items=[]; render(); return; }

  if(eventSource) eventSource.close();
  itemsMap={};
  document.getElementById('listView').innerHTML=`<div class="empty"><div class="eico">⏳</div><div class="etxt">連線中…</div></div>`;

  eventSource = new EventSource(dbPath());
  eventSource.addEventListener('put', e=>{
    const {path,data}=JSON.parse(e.data);
    if(path==='/'){ itemsMap=data||{}; }
    else{ const id=path.slice(1).split('/')[0]; if(data===null){ delete itemsMap[id]; } else{ itemsMap[id]=data; } }
    refreshItemsFromMap();
  });
  eventSource.addEventListener('patch', e=>{
    const {path,data}=JSON.parse(e.data);
    const id=path.slice(1).split('/')[0];
    if(id){ itemsMap[id]={...(itemsMap[id]||{}),...data}; refreshItemsFromMap(); }
  });
  eventSource.onerror = ()=>{
    if(items.length===0){ document.getElementById('listView').innerHTML=`<div class="empty"><div class="eico">⚠️</div><div class="etxt">連線失敗，請檢查網路</div></div>`; }
  };
}

const today=()=>new Date().toISOString().split('T')[0];
const fmt=d=>{ if(!d)return'—'; const[,m,dd]=d.split('-'); return`${m}/${dd}`; };

  if(m<1)return'剛才'; if(m<60)return`${m}分前`;
  const h=Math.floor(m/60); if(h<24)return`${h}小時前`;
  return`${Math.floor(h/24)}天前`;

function photoStripHTML(it){

function cardHTML(it){
  const isDone=it.status==='已完成', isSched=it.status==='已排定';

  const measureOverdue = it.scheduledDate && it.scheduledDate<td && !isDone;

    <div class="cbody">
      <div class="irow">
        <div class="icell"><span class="ilbl">負責人</span><span class="ival">${it.owner||'—'}</span></div>

  </div>`;
}

function renderList(){
  const pending=items.filter(i=>i.status==='待安排');
  const sched=[...items.filter(i=>i.status==='已排定')].sort((a,b)=>((a.scheduledDate||'')+((a.scheduledTime||''))).localeCompare((b.scheduledDate||'')+(b.scheduledTime||'')));

function updateStats(){
  const tot=items.length;
  const pend=items.filter(i=>i.status==='待安排').length;
  const sch=items.filter(i=>i.status==='已排定').length;
  const dn=items.filter(i=>i.status==='已完成').length;

  const overdue=items.filter(i=>
    (i.scheduledDate&&i.scheduledDate<td&&i.status!=='已完成') ||
    (i.installDate&&i.installDate<td&&!i.installDone) ||
    (i.paymentDate&&i.paymentDate<td&&!i.paymentDone)

  document.getElementById('statsBar').innerHTML=
    `<div class="spill"><span class="n">${tot}</span><span class="l">丈量案</span></div>

// ── calendar ──
function renderCal(){
  const months=['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
  document.getElementById('calTitle').textContent=`${calYear} 年 ${months[calMonth]}`;
  const firstDay=new Date(calYear,calMonth,1).getDay();
  const daysInMonth=new Date(calYear,calMonth+1,0).getDate();
  const daysInPrev=new Date(calYear,calMonth,0).getDate();
  const td=today();
  const monthPrefix=`${calYear}-${String(calMonth+1).padStart(2,'0')}`;
  const dayEventsMap={};
  items.forEach(it=>{
    if(it.scheduledDate&&it.scheduledDate.startsWith(monthPrefix)){
      const d=parseInt(it.scheduledDate.split('-')[2]);
      (dayEventsMap[d]=dayEventsMap[d]||[]).push({type:'measure',time:it.scheduledTime||''});
    }
    if(it.installDate&&it.installDate.startsWith(monthPrefix)){
      const d=parseInt(it.installDate.split('-')[2]);
      (dayEventsMap[d]=dayEventsMap[d]||[]).push({type:'install',time:''});
    }
    if(it.paymentDate&&it.paymentDate.startsWith(monthPrefix)){
      const d=parseInt(it.paymentDate.split('-')[2]);
      (dayEventsMap[d]=dayEventsMap[d]||[]).push({type:'payment',time:''});
    }
  });
  const dows=['日','一','二','三','四','五','六'];
  let html=dows.map(d=>`<div class="cal-dow">${d}</div>`).join('');
  for(let i=0;i<firstDay;i++){ const d=daysInPrev-firstDay+1+i; html+=`<div class="cal-day other-month"><span class="cal-dn">${d}</span></div>`; }
  for(let d=1;d<=daysInMonth;d++){
    const dateStr=`${monthPrefix}-${String(d).padStart(2,'0')}`;
    const isToday=dateStr===td;
    const evs=(dayEventsMap[d]||[]).sort((a,b)=>(a.time||'99:99').localeCompare(b.time||'99:99'));
    const maxShow=2;
    const miniHTML=evs.slice(0,maxShow).map(ev=>{
      const color=isToday?'#fff':(ev.type==='measure'?'var(--blue)':ev.type==='install'?'var(--violet)':'var(--orange)');
      const txt=ev.type==='measure'?(ev.time||'全天'):(ev.type==='install'?'安裝':'收款');
      return `<div class="cal-ev-mini" style="color:${color}">${txt}</div>`;
    }).join('')+(evs.length>maxShow?`<div class="cal-ev-mini" style="color:${isToday?'#fff':'var(--text3)'}">+${evs.length-maxShow}</div>`:'');
    html+=`<div class="cal-day ${isToday?'today':''}" onclick="calDayClick(${d})"><span class="cal-dn">${d}</span><div class="cal-mini-list">${miniHTML}</div></div>`;
  }
  document.getElementById('calGrid').innerHTML=html;

  const evsAll=[
    ...items.filter(i=>i.scheduledDate&&i.scheduledDate.startsWith(monthPrefix)).map(it=>({...it,_type:'measure',_date:it.scheduledDate,_time:it.scheduledTime||''})),
    ...items.filter(i=>i.installDate&&i.installDate.startsWith(monthPrefix)).map(it=>({...it,_type:'install',_date:it.installDate,_time:''})),
    ...items.filter(i=>i.paymentDate&&i.paymentDate.startsWith(monthPrefix)).map(it=>({...it,_type:'payment',_date:it.paymentDate,_time:''})),
  ].sort((a,b)=>((a._date||'')+(a._time||'')).localeCompare((b._date||'')+(b._time||'')));
  if(!evsAll.length){ document.getElementById('calEvents').innerHTML=`<div class="cal-ev-head">本月無行程</div>`; return; }
  document.getElementById('calEvents').innerHTML=`<div class="cal-ev-head">本月行程</div>`+evsAll.map(ev=>{
    const color=ev._type==='measure'?'var(--blue)':ev._type==='install'?'var(--violet)':'var(--orange)';
    const label=ev._type==='measure'?'🔵 丈量':ev._type==='install'?'🟣 安裝':'🟠 收款';
    return `<div class="cal-ev-card">
      <div class="cal-ev-dot" style="background:${color}"></div>
      <div class="cal-ev-info"><div class="cal-ev-name">${label} · ${ev.name}</div><div class="cal-ev-sub">${ev._time?ev._time+' · ':''}${ev.owner||''}${ev.address?' · 📍'+ev.address:''}</div></div>
      <div class="cal-ev-date">${fmt(ev._date)}</div>
    </div>`;
  }).join('');
}
window.calPrev=()=>{ calMonth--; if(calMonth<0){calMonth=11;calYear--;} renderCal(); };
window.calNext=()=>{ calMonth++; if(calMonth>11){calMonth=0;calYear++;} renderCal(); };

window.calDayClick=(d)=>{
  const dateStr=`${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  document.getElementById('dayPanelTitle').textContent=`${calMonth+1}月${d}日 行程`;
  const dayItems=[
    ...items.filter(i=>i.scheduledDate===dateStr).map(it=>({...it,_type:'measure',_time:it.scheduledTime||''})),
    ...items.filter(i=>i.installDate===dateStr).map(it=>({...it,_type:'install',_time:''})),
    ...items.filter(i=>i.paymentDate===dateStr).map(it=>({...it,_type:'payment',_time:''})),
  ].sort((a,b)=>(a._time||'99:99').localeCompare(b._time||'99:99'));
  const list=document.getElementById('dayPanelList');
  if(!dayItems.length){ list.innerHTML=`<div class="day-empty">這天沒有安排</div>`; }
  else{
    list.innerHTML=dayItems.map(it=>{
      const color=it._type==='measure'?'var(--blue)':it._type==='install'?'var(--violet)':'var(--orange)';
      const typeLabel=it._type==='measure'?'🔵 丈量':it._type==='install'?'🟣 安裝':'🟠 收款';
      const timeLabel=it._type==='measure'?(it.scheduledTime||'時間未定'):'全天';
      return `<div class="day-item">
      <div class="day-item-stripe" style="background:${color}"></div>
      <div class="day-item-body">
        <div class="day-item-time">🕐 ${timeLabel} · ${typeLabel}</div>
        <div class="day-item-name">${it.name}</div>
        <div class="day-item-chips"><span class="chip ch-${it.status}">${it.status}</span>${it.gcalEventId?'<span class="chip" style="background:rgba(48,88,160,0.10);color:var(--blue)">📆 已同步日曆</span>':''}</div>
        <div class="day-item-meta"><div class="day-item-cell"><span class="day-item-lbl">負責人</span><span class="day-item-val">${it.owner||'—'}</span></div></div>
        ${it.address?`<div style="display:flex;align-items:center;justify-content:space-between;gap:8px;"><span class="day-item-val" style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">📍 ${it.address}</span><button class="day-item-editbtn" onclick="openNav('${it.address.replace(/'/g,"\\'")}')">🧭 導航</button></div>`:''}
        ${it.note?`<div class="day-item-note">${it.note.replace(/\n/g,'<br>')}</div>`:''}
        <button class="day-item-editbtn" onclick="closeDayPanel();openEdit('${it.id}')">✏️ 編輯</button>
      </div>
    </div>`;
    }).join('');
  }
  document.getElementById('dayOverlay').classList.add('open');
};
window.closeDayPanel=(e)=>{ if(e && e.target!==document.getElementById('dayOverlay')) return; document.getElementById('dayOverlay').classList.remove('open'); };

window.switchView=(v)=>{
  currentView=v;
  document.getElementById('listView').style.display=v==='list'?'':'none';
  document.getElementById('calView').style.display=v==='cal'?'':'none';
  document.getElementById('vt-list').classList.toggle('active',v==='list');
  document.getElementById('vt-cal').classList.toggle('active',v==='cal');
  render();
};

window.markDone=async(id)=>{
  if(!FIREBASE_READY) return;
  try{ await dbPatch(id,{status:'已完成',updatedAt:Date.now()}); toast('✅ 已標記完成'); }
  catch{ toast('❌ 操作失敗'); }
};
window.deleteItem=async(id)=>{
  if(!confirm('確定刪除？'))return;
  const it=items.find(i=>i.id===id);
  if(it && it.gcalEventId && gcalSignedIn) await deleteGcalEvent(it.gcalEventId);
  if(!FIREBASE_READY) return;
  try{ await dbDelete(id); toast('已刪除'); }
  catch{ toast('❌ 刪除失敗'); }
};

// ── modal ──
function loadFormDraft(it){
  document.getElementById('f_name').value=it?.name||'';
  document.getElementById('f_address').value=it?.address||'';
  document.getElementById('f_status').value=it?.status||'待安排';
  document.getElementById('f_owner').value=it?.owner||'';
  document.getElementById('f_date').value=it?.scheduledDate||'';
  document.getElementById('f_time').value=it?.scheduledTime||'';
  document.getElementById('f_note').value=it?.note||'';
  document.getElementById('f_operator').value=it?.operator||'';
  document.getElementById('f_installDate').value=it?.installDate||'';
  document.getElementById('f_installDone').checked=!!it?.installDone;
  document.getElementById('f_paymentDate').value=it?.paymentDate||'';
  document.getElementById('f_paymentDone').checked=!!it?.paymentDone;
  draftPhotos={ sitePhotos:[...(it?.sitePhotos||[])], orderSlips:[...(it?.orderSlips||[])], paymentShots:[...(it?.paymentShots||[])] };
  window.draftPhotos=draftPhotos;
  renderPhotoGrid('sitePhotos'); renderPhotoGrid('orderSlips'); renderPhotoGrid('paymentShots');
  document.getElementById('toggle_gcal').className='toggle'+((it?.gcalEventId)?' on':'');
  document.getElementById('toggle_gcal_install').className='toggle'+((it?.installGcalEventId)?' on':'');
  document.getElementById('toggle_gcal_payment').className='toggle'+((it?.paymentGcalEventId)?' on':'');
  onStatusChange();
}
window.openModal=(id=null)=>{
  editId=id;
  document.getElementById('modalTitle').textContent=id?'編輯丈量安排':'新增待丈量區';
  loadFormDraft(id?items.find(i=>i.id===id):null);
  document.getElementById('modalOverlay').classList.add('open');
};
window.openEdit=id=>window.openModal(id);
window.closeModal=()=>{ document.getElementById('modalOverlay').classList.remove('open'); editId=null; };
window.toggleGcalSync=(elId)=>{ const t=document.getElementById(elId); t.className='toggle'+(t.classList.contains('on')?'':' on'); };

window.saveItem=async()=>{
  if(!FIREBASE_READY){ toast('⚠️ 尚未設定同步伺服器，請見說明文件'); return; }
  const name=document.getElementById('f_name').value.trim(); if(!name){toast('請輸入名稱');return;}
  const status=document.getElementById('f_status').value;
  const data={
    name, status,
    address:document.getElementById('f_address').value.trim(),
    owner:document.getElementById('f_owner').value.trim(),
    scheduledDate: status==='待安排'?null:(document.getElementById('f_date').value||null),
    scheduledTime: status==='待安排'?null:(document.getElementById('f_time').value||null),
    note:document.getElementById('f_note').value.trim(),
    lastOperator:document.getElementById('f_operator').value.trim()||'未知',
    installDate: document.getElementById('f_installDate').value||null,
    installDone: document.getElementById('f_installDone').checked,
    paymentDate: document.getElementById('f_paymentDate').value||null,
    paymentDone: document.getElementById('f_paymentDone').checked,
    sitePhotos: draftPhotos.sitePhotos,
    orderSlips: draftPhotos.orderSlips,
    paymentShots: draftPhotos.paymentShots,
    updatedAt:Date.now(),
  };
  try{
    let savedId=editId;
    if(editId){ await dbPatch(editId,data); }
    else{ savedId=await dbPost({...data,createdAt:Date.now()}); }

    const wantsGcal=document.getElementById('toggle_gcal').classList.contains('on');
    const wantsGcalInstall=document.getElementById('toggle_gcal_install').classList.contains('on');
    const wantsGcalPayment=document.getElementById('toggle_gcal_payment').classList.contains('on');
    const existing=items.find(i=>i.id===savedId);

    if(gcalSignedIn && wantsGcal && data.scheduledDate){
      const eid=await syncGcalEvent(existing?.gcalEventId,{summary:`丈量：${data.name}`,location:data.address,description:data.note,date:data.scheduledDate,time:data.scheduledTime});
      if(eid) await dbPatch(savedId,{gcalEventId:eid});
    } else if(gcalSignedIn && !wantsGcal && existing?.gcalEventId){
      await deleteGcalEvent(existing.gcalEventId); await dbPatch(savedId,{gcalEventId:null});
    }
    if(gcalSignedIn && wantsGcalInstall && data.installDate){
      const eid=await syncGcalEvent(existing?.installGcalEventId,{summary:`安裝：${data.name}`,location:data.address,description:data.note,date:data.installDate,time:null});
      if(eid) await dbPatch(savedId,{installGcalEventId:eid});
    } else if(gcalSignedIn && !wantsGcalInstall && existing?.installGcalEventId){
      await deleteGcalEvent(existing.installGcalEventId); await dbPatch(savedId,{installGcalEventId:null});
    }
    if(gcalSignedIn && wantsGcalPayment && data.paymentDate){
      const eid=await syncGcalEvent(existing?.paymentGcalEventId,{summary:`收尾款提醒：${data.name}`,location:'',description:data.note,date:data.paymentDate,time:null});
      if(eid) await dbPatch(savedId,{paymentGcalEventId:eid});
    } else if(gcalSignedIn && !wantsGcalPayment && existing?.paymentGcalEventId){
      await deleteGcalEvent(existing.paymentGcalEventId); await dbPatch(savedId,{paymentGcalEventId:null});
    }
    toast('✅ 已儲存'); closeModal();
  }catch(e){ toast('❌ 儲存失敗'); console.error(e); }
};

// ── Google Calendar sync (Google Identity Services) ──
let gcalSignedIn=false, gcalToken=null;
if(!GOOGLE_CLIENT_ID){ document.getElementById('gcalBtn').style.display='none'; }

window.connectGoogleCalendar=()=>{
  if(!GOOGLE_CLIENT_ID){ toast('尚未設定 Google 用戶端 ID'); return; }
  if(gcalSignedIn){ toast('已連接 Google 日曆'); return; }
  if(!window.google){ toast('Google 服務載入中，請稍後再試'); return; }
  const client = google.accounts.oauth2.initTokenClient({
    client_id: GOOGLE_CLIENT_ID,
    scope: GOOGLE_SCOPE,
    callback: (resp)=>{
      if(resp.error){ toast('❌ 連接失敗'); return; }
      gcalToken=resp.access_token; gcalSignedIn=true;
      document.getElementById('gcalBtn').textContent='📆 已連接日曆';
      document.getElementById('gcalBtn').classList.add('on');
      updateGcalRows();
      toast('✅ 已連接 Google 日曆');
    }
  });
  client.requestAccessToken();
};

async function syncGcalEvent(existingEventId, {summary,location,description,date,time}){
  if(!gcalToken||!date) return existingEventId||null;
  const start=time?`${date}T${time}:00`:`${date}`;
  const isAllDay=!time;
  const endDate=(()=>{ if(!isAllDay) return null; const d=new Date(date); d.setDate(d.getDate()+1); return d.toISOString().split('T')[0]; })();
  const body={
    summary,
    location:location||'',
    description:description||'',
    start:isAllDay?{date}:{dateTime:start,timeZone:Intl.DateTimeFormat().resolvedOptions().timeZone},
    end:isAllDay?{date:endDate}:{dateTime:new Date(new Date(start).getTime()+60*60*1000).toISOString(),timeZone:Intl.DateTimeFormat().resolvedOptions().timeZone},
  };
  const url=existingEventId
    ? `https://www.googleapis.com/calendar/v3/calendars/primary/events/${existingEventId}`
    : `https://www.googleapis.com/calendar/v3/calendars/primary/events`;
  const method=existingEventId?'PATCH':'POST';
  const res=await fetch(url,{method,headers:{'Authorization':`Bearer ${gcalToken}`,'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(!res.ok){ toast('⚠️ Google 日曆同步失敗'); return existingEventId||null; }
  const json=await res.json();
  return json.id;
}
async function deleteGcalEvent(eventId){
  if(!gcalToken||!eventId) return;
  await fetch(`https://www.googleapis.com/calendar/v3/calendars/primary/events/${eventId}`,{method:'DELETE',headers:{'Authorization':`Bearer ${gcalToken}`}}).catch(()=>{});
}

if(GOOGLE_CLIENT_ID){
  const s=document.createElement('script');
  s.src='https://accounts.google.com/gsi/client';
  s.async=true; document.head.appendChild(s);
}

if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
