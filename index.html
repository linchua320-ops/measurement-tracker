<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="丈量排程">
<meta name="theme-color" content="#f7f9f4">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<title>丈量排程</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;600;700;900&display=swap');
:root {
  --bg:#f7f9f4;            /* white + ~5% matcha */
  --surface:#ffffff;
  --sur2:#eef2e7;          /* white + ~10% matcha */
  --sur3:#f3f6ef;
  --border:#e3e9db;
  --text:#20261c;
  --text2:#5c6552;
  --text3:#9aa38c;
  --accent:#71905d;
  --accent-dark:#526b40;
  --accent-soft:rgba(113,144,93,0.12);
  --accent-soft2:rgba(113,144,93,0.20);
  --red:#b8564f;
  --red-soft:rgba(184,86,79,0.12);
  --amber:#a9822a;
  --amber-soft:rgba(169,130,42,0.13);
  --blue:#4f77a8;
  --blue-soft:rgba(79,119,168,0.12);
  --rcard:20px; --rbtn:14px; --rchip:100px;
  --shs:0 1px 2px rgba(35,45,25,0.05),0 1px 3px rgba(35,45,25,0.04);
  --shm:0 2px 10px rgba(35,45,25,0.06),0 10px 26px rgba(35,45,25,0.05);
}
/* ── purpose colors ── */
.p-丈量{--pc:#4f77a8;--pcs:rgba(79,119,168,0.12);}
.p-拜訪{--pc:#b8763f;--pcs:rgba(184,118,63,0.13);}
.p-送貨{--pc:#8a6bb0;--pcs:rgba(138,107,176,0.13);}
.p-其他{--pc:#5c7a4e;--pcs:rgba(92,122,78,0.13);}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:'Noto Sans TC',-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;min-height:-webkit-fill-available;overflow-x:hidden;}
.header{position:sticky;top:0;z-index:100;background:rgba(247,249,244,0.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);padding:env(safe-area-inset-top,0) 0 0;border-bottom:1px solid transparent;}
.hinner{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 10px;max-width:900px;margin:0 auto;}
.logo-title{font-size:26px;font-weight:900;letter-spacing:-0.5px;line-height:1;color:var(--text);}
.logo-sub{font-size:10px;color:var(--text3);font-weight:500;letter-spacing:1.5px;margin-top:3px;}
.hbtns{display:flex;gap:8px;align-items:center;}
.add-btn{width:42px;height:42px;border-radius:15px;background:linear-gradient(155deg,var(--accent),var(--accent-dark));border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#fff;font-size:24px;font-weight:300;line-height:1;box-shadow:0 3px 12px rgba(82,107,64,0.32);transition:transform 0.15s,box-shadow 0.15s;}
.add-btn:active{transform:scale(0.90);box-shadow:0 1px 6px rgba(82,107,64,0.28);}
.view-toggle{display:flex;background:var(--sur2);border-radius:12px;padding:3px;gap:2px;}
.vtbtn{padding:7px 12px;border-radius:9px;border:none;background:transparent;cursor:pointer;font-size:14px;color:var(--text2);transition:background 0.15s,box-shadow 0.15s;}
.vtbtn.active{background:var(--surface);box-shadow:var(--shs);color:var(--text);}
.stats-row{display:flex;gap:8px;padding:6px 20px 10px;overflow-x:auto;scrollbar-width:none;max-width:900px;margin:0 auto;}
.stats-row::-webkit-scrollbar{display:none;}
.spill{flex-shrink:0;display:flex;align-items:baseline;gap:5px;background:var(--surface);border:1.5px solid var(--border);border-radius:var(--rchip);padding:6px 14px;white-space:nowrap;cursor:pointer;transition:border-color 0.15s,background 0.15s,transform 0.1s;}
.spill:active{transform:scale(0.96);}
.spill.on{background:var(--accent-soft);border-color:var(--accent);}
.spill .n{font-size:15px;font-weight:700;}
.spill .l{font-size:11px;color:var(--text3);font-weight:500;}
.hdivider{height:1px;background:var(--border);margin:0 20px;max-width:860px;margin-left:auto;margin-right:auto;}
.list{padding:14px 16px 110px;max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:12px;}
.section-head{display:flex;align-items:center;gap:10px;padding:6px 0 2px;}
.section-head-title{font-size:12.5px;font-weight:700;color:var(--text3);letter-spacing:0.8px;text-transform:uppercase;}
.section-divider{flex:1;height:1px;background:var(--border);}
.clear-filter{font-size:11px;font-weight:600;color:var(--accent-dark);background:var(--accent-soft);border:none;border-radius:var(--rchip);padding:4px 11px;cursor:pointer;}
.card{background:var(--surface);border-radius:var(--rcard);overflow:hidden;box-shadow:var(--shm);position:relative;border:1px solid var(--border);}
.card.done-card{opacity:0.62;}
.cstripe{height:4px;background:var(--pc,var(--border));}
.ctop{display:flex;align-items:flex-start;justify-content:space-between;padding:16px 16px 8px;gap:10px;}
.cleft{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px;}
.cname{font-size:16.5px;font-weight:700;line-height:1.3;letter-spacing:-0.1px;}
.card.done-card .cname{text-decoration:line-through;color:var(--text3);}
.cchips{display:flex;flex-wrap:wrap;gap:6px;}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:4px 10px 4px 8px;border-radius:var(--rchip);letter-spacing:0.2px;}
.chip-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
.chip-purpose{background:var(--pcs,var(--sur2));color:var(--pc,var(--text2));}
.chip-status{background:var(--sur2);color:var(--text2);}
.ch-待安排{background:#eceeea;color:#767d70;}
.ch-已排定{background:var(--blue-soft);color:var(--blue);}
.ch-已完成{background:var(--accent-soft);color:var(--accent-dark);}
.cacts{display:flex;gap:6px;flex-shrink:0;padding-top:2px;}
.actbtn{width:33px;height:33px;border-radius:11px;background:var(--sur2);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;transition:background 0.15s,transform 0.1s;}
.actbtn:active{background:var(--border);transform:scale(0.92);}
.done-btn{background:var(--accent-soft);color:var(--accent-dark);font-size:15px;}
.cbody{padding:0 16px 14px;display:flex;flex-direction:column;gap:8px;}
.irow{display:grid;grid-template-columns:1fr 1fr;gap:8px 16px;}
.icell{display:flex;flex-direction:column;gap:2px;}
.ilbl{font-size:10px;font-weight:600;color:var(--text3);letter-spacing:0.6px;text-transform:uppercase;}
.ival{font-size:13px;font-weight:500;color:var(--text2);}
.addr-row{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.addr-row .ival{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.drive-chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;color:var(--text2);background:var(--sur2);border-radius:var(--rchip);padding:3px 9px;flex-shrink:0;white-space:nowrap;}
.noteblock{background:var(--sur3);border-radius:11px;padding:9px 12px;font-size:12px;font-weight:400;color:var(--text2);line-height:1.65;}
.cfoot{display:flex;align-items:center;justify-content:space-between;padding:9px 16px;border-top:1px solid var(--border);}
.fuser,.ftime{font-size:11px;color:var(--text3);}
/* CALENDAR */
.cal-wrap{padding:14px 16px 110px;max-width:900px;margin:0 auto;}
.cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.cal-title{font-size:19px;font-weight:800;letter-spacing:-0.2px;}
.cal-nav{width:36px;height:36px;border-radius:12px;background:var(--surface);border:1px solid var(--border);cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;color:var(--text2);transition:background 0.15s;}
.cal-nav:active{background:var(--sur2);}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:22px;background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:10px;box-shadow:var(--shs);}
.cal-dow{text-align:center;font-size:11px;font-weight:600;color:var(--text3);padding:4px 0 8px;}
.cal-day{aspect-ratio:1;border-radius:11px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:5px;cursor:pointer;position:relative;transition:background 0.12s;}
.cal-day:hover{background:var(--sur3);}
.cal-day.today{background:var(--accent);}
.cal-day.today .cal-dn{color:#fff;font-weight:700;}
.cal-day.other-month .cal-dn{color:var(--text3);opacity:0.5;}
.cal-dn{font-size:13px;font-weight:500;line-height:1;}
.cal-dots{display:flex;gap:2px;justify-content:center;margin-top:3px;}
.cal-dot{width:5px;height:5px;border-radius:50%;}
.cal-section-head{display:flex;align-items:center;gap:8px;padding:14px 2px 6px;}
.cal-section-title{font-size:13px;font-weight:700;color:var(--text);}
.cal-district-head{font-size:11px;font-weight:700;color:var(--text3);letter-spacing:0.4px;padding:10px 4px 6px;display:flex;align-items:center;gap:5px;}
.cal-events{display:flex;flex-direction:column;}
.cal-ev-card{background:var(--surface);border:1px solid var(--border);border-radius:15px;padding:11px 12px;display:flex;align-items:center;gap:10px;box-shadow:var(--shs);margin-bottom:8px;}
.cal-ev-card.past{opacity:0.55;}
.cal-ev-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;background:var(--pc,var(--text3));}
.cal-ev-info{flex:1;min-width:0;}
.cal-ev-name{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cal-ev-sub{font-size:11px;color:var(--text3);margin-top:2px;}
.cal-ev-date{font-size:12px;font-weight:600;color:var(--text2);flex-shrink:0;text-align:right;}
.cal-ev-edit{width:28px;height:28px;border-radius:9px;background:var(--sur2);border:none;font-size:12px;cursor:pointer;flex-shrink:0;}
.cal-empty{text-align:center;padding:30px 10px;color:var(--text3);font-size:13px;}
/* MODAL */
.overlay{position:fixed;inset:0;z-index:200;background:rgba(20,24,16,0.5);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity 0.22s;}
.overlay.open{opacity:1;pointer-events:all;}
.modal{width:100%;max-width:560px;background:var(--bg);border-radius:26px 26px 0 0;padding-bottom:env(safe-area-inset-bottom,20px);transform:translateY(100%);transition:transform 0.32s cubic-bezier(0.32,0.72,0,1);max-height:93vh;overflow-y:auto;}
.overlay.open .modal{transform:translateY(0);}
.mhandle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:14px auto 0;}
.mhead{display:flex;align-items:center;justify-content:space-between;padding:16px 22px 6px;}
.mhead-title{font-size:19px;font-weight:800;letter-spacing:-0.3px;}
.mclose{width:30px;height:30px;border-radius:50%;background:var(--sur2);border:none;cursor:pointer;font-size:15px;color:var(--text2);display:flex;align-items:center;justify-content:center;}
.form{padding:10px 22px 24px;display:flex;flex-direction:column;gap:16px;}
.fgrp{display:flex;flex-direction:column;gap:6px;}
.flbl{font-size:11px;font-weight:700;color:var(--text3);letter-spacing:0.7px;text-transform:uppercase;}
.finput,.fselect,.ftextarea{background:var(--surface);border:1.5px solid var(--border);border-radius:14px;color:var(--text);padding:12px 14px;font-size:15px;font-family:inherit;outline:none;width:100%;-webkit-appearance:none;appearance:none;transition:border-color 0.15s;}
.finput:focus,.fselect:focus,.ftextarea:focus{border-color:var(--accent);}
.ftextarea{resize:none;min-height:76px;line-height:1.55;}
.fgrow2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.fgrow3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
.purpose-picker{display:flex;gap:7px;flex-wrap:wrap;}
.p-opt{flex:1;min-width:64px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 6px;border-radius:14px;border:1.5px solid var(--border);background:var(--surface);cursor:pointer;font-size:12px;font-weight:600;color:var(--text2);transition:border-color 0.15s,background 0.15s;}
.p-opt .pdot{width:12px;height:12px;border-radius:50%;background:var(--pc);}
.p-opt.sel{border-color:var(--pc);background:var(--pcs);color:var(--pc);}
.savebtn{width:100%;padding:15px;border-radius:16px;background:linear-gradient(155deg,var(--accent),var(--accent-dark));border:none;color:#fff;font-size:16px;font-weight:800;font-family:inherit;cursor:pointer;box-shadow:0 4px 16px rgba(82,107,64,0.3);transition:transform 0.1s;}
.savebtn:active{transform:scale(0.97);}
/* DAY PANEL */
.day-overlay{position:fixed;inset:0;z-index:200;background:rgba(20,24,16,0.42);backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity 0.22s;}
.day-overlay.open{opacity:1;pointer-events:all;}
.day-panel{width:100%;max-width:560px;background:var(--bg);border-radius:26px 26px 0 0;padding-bottom:env(safe-area-inset-bottom,24px);transform:translateY(100%);transition:transform 0.32s cubic-bezier(0.32,0.72,0,1);max-height:80vh;overflow-y:auto;}
.day-overlay.open .day-panel{transform:translateY(0);}
.day-handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:14px auto 0;}
.day-head{display:flex;align-items:center;justify-content:space-between;padding:14px 22px 10px;}
.day-head-title{font-size:18px;font-weight:800;}
.day-head-close{width:30px;height:30px;border-radius:50%;background:var(--sur2);border:none;cursor:pointer;font-size:15px;color:var(--text2);display:flex;align-items:center;justify-content:center;}
.day-list{display:flex;flex-direction:column;gap:10px;padding:4px 16px 10px;}
.day-item{background:var(--surface);border:1px solid var(--border);border-radius:17px;overflow:hidden;box-shadow:var(--shs);}
.day-item-stripe{height:4px;background:var(--pc,var(--border));}
.day-item-body{padding:13px 15px 12px;display:flex;flex-direction:column;gap:7px;}
.day-item-time{font-size:13px;font-weight:800;color:var(--text);display:flex;align-items:center;gap:10px;}
.day-item-district{font-size:11.5px;font-weight:600;color:var(--text3);}
.day-item-name{font-size:16px;font-weight:700;line-height:1.25;}
.day-item-chips{display:flex;flex-wrap:wrap;gap:5px;}
.day-item-meta{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;}
.day-item-cell{display:flex;flex-direction:column;gap:1px;}
.day-item-lbl{font-size:10px;font-weight:500;color:var(--text3);letter-spacing:0.5px;text-transform:uppercase;}
.day-item-val{font-size:12px;font-weight:500;color:var(--text2);}
.day-item-note{font-size:12px;color:var(--text2);background:var(--sur3);border-radius:9px;padding:7px 10px;line-height:1.6;}
.day-item-editbtn{align-self:flex-end;padding:5px 14px;border-radius:var(--rchip);background:var(--sur2);border:none;font-size:12px;font-weight:600;color:var(--accent-dark);cursor:pointer;font-family:inherit;}
.day-empty{text-align:center;padding:30px 20px;color:var(--text3);font-size:14px;}
.empty{text-align:center;padding:70px 20px;color:var(--text3);}
.eico{font-size:52px;margin-bottom:14px;}
.etxt{font-size:15px;font-weight:300;line-height:1.7;}
.toast{position:fixed;bottom:calc(88px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%) translateY(14px);background:var(--text);color:#fff;padding:10px 20px;border-radius:var(--rchip);font-size:13px;font-weight:500;z-index:400;opacity:0;pointer-events:none;transition:opacity 0.18s,transform 0.18s;white-space:nowrap;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.login-screen{position:fixed;inset:0;z-index:999;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:32px 24px;}
.login-box{width:100%;max-width:360px;display:flex;flex-direction:column;align-items:center;gap:28px;}
.login-icon{width:88px;height:88px;border-radius:24px;box-shadow:0 8px 24px rgba(82,107,64,0.28);}
.login-title{font-size:27px;font-weight:900;letter-spacing:-0.5px;text-align:center;}
.login-sub{font-size:14px;color:var(--text3);text-align:center;line-height:1.6;margin-top:-16px;}
.login-form{width:100%;display:flex;flex-direction:column;gap:12px;}
.login-input{width:100%;background:var(--surface);border:1.5px solid var(--border);border-radius:16px;color:var(--text);padding:14px 16px;font-size:16px;font-family:inherit;outline:none;text-align:center;}
.login-input:focus{border-color:var(--accent);}
.login-btn{width:100%;padding:15px;border-radius:16px;background:linear-gradient(155deg,var(--accent),var(--accent-dark));border:none;color:#fff;font-size:16px;font-weight:800;font-family:inherit;cursor:pointer;box-shadow:0 4px 16px rgba(82,107,64,0.3);}
.user-badge{display:flex;align-items:center;gap:6px;background:var(--sur2);border:1px solid var(--border);border-radius:var(--rchip);padding:5px 12px;font-size:12px;font-weight:600;color:var(--text2);cursor:pointer;max-width:100px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;}
.setup-banner{margin:0 20px 8px;max-width:860px;margin-left:auto;margin-right:auto;background:var(--red-soft);border:1px solid rgba(184,86,79,0.28);border-radius:14px;padding:10px 14px;font-size:12px;color:var(--red);line-height:1.6;}
</style>
</head>
<body>

<div class="login-screen" id="loginScreen">
  <div class="login-box">
    <img class="login-icon" src="icon-192.png" alt="丈量排程">
    <div class="login-title">丈量排程</div>
    <div class="login-sub">請輸入您的名稱<br>首次登入後將自動記住</div>
    <div class="login-form">
      <input class="login-input" id="loginInput" type="text" placeholder="輸入您的名稱" maxlength="20" autocomplete="off">
      <button class="login-btn" onclick="doLogin()">進入</button>
    </div>
    <div id="recoverToggle" style="font-size:12px;color:var(--text3);cursor:pointer;text-decoration:underline;" onclick="showRecoverBox()">資料不見了？點此嘗試找回</div>
    <div id="recoverBox" style="display:none;width:100%;flex-direction:column;gap:10px;background:var(--sur2);border-radius:16px;padding:14px;">
      <div style="font-size:12px;color:var(--text2);line-height:1.6;">如果你之前用過這個 App、但現在資料不見了，通常是因為之前登入時系統給你的是一串隨機代碼（不是你的名字）。請到 Firebase Console → Firestore Database → 資料，找到 <b>users</b> 集合底下的舊代碼（一串英文數字，通常開頭是 u_），貼在下面，並輸入你「現在」要用的名稱，就可以把舊資料搬過來。</div>
      <input class="login-input" id="recoverOldCode" type="text" placeholder="舊代碼（例如 u_xxxxxxx）" style="font-size:13px;padding:10px 12px;">
      <input class="login-input" id="recoverNewName" type="text" placeholder="你現在的名稱" style="font-size:13px;padding:10px 12px;">
      <button class="login-btn" style="font-size:14px;padding:11px;" onclick="recoverData()">搬移資料</button>
    </div>
  </div>
</div>

<header class="header">
  <div class="hinner">
    <div>
      <div class="logo-title">丈量排程</div>
      <div class="logo-sub">SITE SCHEDULE</div>
    </div>
    <div id="userBadge" class="user-badge" onclick="switchUser()" style="display:none">👤 <span id="userBadgeName"></span></div>
    <div class="hbtns">
      <div class="view-toggle">
        <button class="vtbtn active" id="vt-list" onclick="switchView('list')">☰</button>
        <button class="vtbtn" id="vt-cal" onclick="switchView('cal')">📅</button>
      </div>
      <button class="add-btn" onclick="openModal()">＋</button>
    </div>
  </div>
  <div class="stats-row" id="statsBar"></div>
  <div id="setupBanner"></div>
  <div class="hdivider"></div>
</header>

<main class="list" id="listView"></main>

<div class="cal-wrap" id="calView" style="display:none">
  <div class="cal-header">
    <button class="cal-nav" onclick="calPrev()">‹</button>
    <div class="cal-title" id="calTitle"></div>
    <button class="cal-nav" onclick="calNext()">›</button>
  </div>
  <div class="cal-grid" id="calGrid"></div>
  <div id="calEvents"></div>
</div>

<div class="toast" id="toast"></div>

<div class="day-overlay" id="dayOverlay" onclick="closeDayPanel(event)">
  <div class="day-panel" id="dayPanel">
    <div class="day-handle"></div>
    <div class="day-head">

// ── 預估車程 (Google Distance Matrix) ──
let mapsLoaded=false, mapsLoading=null;
function loadMapsApi(){
  if(mapsLoaded) return Promise.resolve();
  if(mapsLoading) return mapsLoading;
  mapsLoading = new Promise((resolve,reject)=>{
    if(!GOOGLE_MAPS_API_KEY){ reject(new Error('no key')); return; }
    const s=document.createElement('script');
    s.src=`https://maps.googleapis.com/maps/api/js?key=${GOOGLE_MAPS_API_KEY}`;
    s.onload=()=>{ mapsLoaded=true; resolve(); };
    s.onerror=()=>reject(new Error('load fail'));
    document.head.appendChild(s);
  });
  return mapsLoading;
}
async function estimateDrive(address){
  if(!address || !GOOGLE_MAPS_API_KEY) return null;
  try{ await loadMapsApi(); }catch{ return {error:'load'}; }
  return new Promise(resolve=>{
    const service=new google.maps.DistanceMatrixService();
    service.getDistanceMatrix({
      origins:[ORIGIN_ADDRESS],
      destinations:[address],
      travelMode: google.maps.TravelMode.DRIVING,
    }, (res,status)=>{
      if(status!=='OK'){ resolve({error:'api'}); return; }
      const el=res.rows?.[0]?.elements?.[0];
      if(!el || el.status!=='OK'){ resolve({error:'route'}); return; }
      resolve({duration:el.duration.text, distance:el.distance.text});
    });
  });
}
let driveDebounce=null;
async function updateDriveHint(address){
  const hint=document.getElementById('driveTimeHint');
  if(!GOOGLE_MAPS_API_KEY){ hint.textContent=''; return; }
  if(!address){ hint.textContent=''; return; }
  hint.textContent='🚗 計算車程中…';
  const r=await estimateDrive(address);
  if(!r){ hint.textContent=''; return; }
  if(r.error){ hint.textContent='⚠️ 無法計算車程'; return; }
  hint.textContent=`🚗 距出發點約 ${r.duration}（${r.distance}）`;
}

});

function extractDistrict(address){
  if(!address) return '';
  let m = address.match(/(?:市|縣)([\u4e00-\u9fa5]{2,3}(?:區|鄉|鎮))/);
  if(m) return m[1];
  m = address.match(/^([\u4e00-\u9fa5]{2,3}(?:區|鄉|鎮))/);
  if(m) return m[1];
  m = address.match(/([\u4e00-\u9fa5]{2,3}(?:區|鄉|鎮))/);
  return m ? m[1] : '';
}

const today=()=>new Date().toISOString().split('T')[0];

function ago(ts){
  if(!ts)return'';
  const ms=ts?.toMillis?ts.toMillis():ts;
  const m=Math.floor((Date.now()-ms)/60000);
  if(m<1)return'剛才'; if(m<60)return`${m}分前`;
  const h=Math.floor(m/60); if(h<24)return`${h}小時前`;
  return`${Math.floor(h/24)}天前`;
}

// ── calendar ──
function renderCal(){
  const months=['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
  document.getElementById('calTitle').textContent=`${calYear} 年 ${months[calMonth]}`;
  const firstDay=new Date(calYear,calMonth,1).getDay();
  const daysInMonth=new Date(calYear,calMonth+1,0).getDate();
  const daysInPrev=new Date(calYear,calMonth,0).getDate();
  const td=today();
  const monthPrefix=`${calYear}-${String(calMonth+1).padStart(2,'0')}`;
  const dotMap={};
  items.forEach(it=>{
    if(it.scheduledDate&&it.scheduledDate.startsWith(monthPrefix)){
      const d=parseInt(it.scheduledDate.split('-')[2]);
      (dotMap[d]=dotMap[d]||[]).push(it);
    }
  });
  const dows=['日','一','二','三','四','五','六'];
  let html=dows.map(d=>`<div class="cal-dow">${d}</div>`).join('');
  for(let i=0;i<firstDay;i++){ const d=daysInPrev-firstDay+1+i; html+=`<div class="cal-day other-month"><span class="cal-dn">${d}</span></div>`; }
  for(let d=1;d<=daysInMonth;d++){
    const dateStr=`${monthPrefix}-${String(d).padStart(2,'0')}`;
    const isToday=dateStr===td;
    const dots=dotMap[d]||[];
    const dotHTML=dots.slice(0,3).map(it=>{ const cls='p-'+(it.purpose||'其他'); return `<div class="cal-dot ${cls}" style="background:var(--pc)"></div>`; }).join('');
    html+=`<div class="cal-day ${isToday?'today':''}" onclick="calDayClick(${d})"><span class="cal-dn">${d}</span><div class="cal-dots">${dotHTML}</div></div>`;
  }
  document.getElementById('calGrid').innerHTML=html;

  const monthEvs=items.filter(i=>i.scheduledDate&&i.scheduledDate.startsWith(monthPrefix));
  const upcoming=monthEvs.filter(e=>e.scheduledDate>=td).sort((a,b)=>((a.scheduledDate||'')+(a.scheduledTime||'')).localeCompare((b.scheduledDate||'')+(b.scheduledTime||'')));
  const past=monthEvs.filter(e=>e.scheduledDate<td).sort((a,b)=>((b.scheduledDate||'')+(b.scheduledTime||'')).localeCompare((a.scheduledDate||'')+(a.scheduledTime||'')));

  function groupByDistrict(evs){
    const map={};
    evs.forEach(e=>{ const d=extractDistrict(e.address)||'未分區'; (map[d]=map[d]||[]).push(e); });
    return Object.entries(map);
  }
  function evCard(ev, isPast){
    const purpose=ev.purpose||'其他';
    return `<div class="cal-ev-card p-${purpose} ${isPast?'past':''}">
      <div class="cal-ev-dot"></div>
      <div class="cal-ev-info"><div class="cal-ev-name">${ev.name}</div><div class="cal-ev-sub">${ev.scheduledTime||'時間未定'}${ev.owner?' · '+ev.owner:''}</div></div>
      <div class="cal-ev-date">${fmt(ev.scheduledDate)}</div>
      <button class="cal-ev-edit" onclick="openEdit('${ev.id}')">✏️</button>
    </div>`;
  }
  function renderGroup(evs, isPast){
    return groupByDistrict(evs).map(([dist,list])=>
      `<div class="cal-district-head">📍 ${dist}</div>${list.map(e=>evCard(e,isPast)).join('')}`
    ).join('');
  }

  let evHtml='';
  if(!monthEvs.length){ evHtml=`<div class="cal-empty">本月尚無排定行程</div>`; }
  else{
    if(upcoming.length){ evHtml+=`<div class="cal-section-head"><span class="cal-section-title">🔜 即將到來</span></div>`+renderGroup(upcoming,false); }
    if(past.length){ evHtml+=`<div class="cal-section-head"><span class="cal-section-title">⏳ 已過</span></div>`+renderGroup(past,true); }
  }
  document.getElementById('calEvents').innerHTML=evHtml;
}
window.calPrev=()=>{ calMonth--; if(calMonth<0){calMonth=11;calYear--;} renderCal(); };
window.calNext=()=>{ calMonth++; if(calMonth>11){calMonth=0;calYear++;} renderCal(); };

window.calDayClick=(d)=>{
  const dateStr=`${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  document.getElementById('dayPanelTitle').textContent=`${calMonth+1}月${d}日 行程`;
  const dayItems=items.filter(i=>i.scheduledDate===dateStr).sort((a,b)=>(a.scheduledTime||'').localeCompare(b.scheduledTime||''));
  const list=document.getElementById('dayPanelList');
  if(!dayItems.length){ list.innerHTML=`<div class="day-empty">這天沒有排定行程</div>`; }
  else{
    list.innerHTML=dayItems.map(it=>{
      const purpose=it.purpose||'其他', dist=extractDistrict(it.address);
      return `<div class="day-item p-${purpose}">
      <div class="day-item-stripe"></div>
      <div class="day-item-body">
        <div class="day-item-time">🕐 ${it.scheduledTime||'時間未定'} ${dist?`<span class="day-item-district">📍 ${dist}</span>`:''}</div>
        <div class="day-item-name">${it.name}</div>
        <div class="day-item-chips"><span class="chip chip-purpose"><span class="chip-dot" style="background:var(--pc)"></span>${PURPOSE_ICON[purpose]||''} ${purpose}</span><span class="chip ch-${it.status}">${it.status}</span></div>
        <div class="day-item-meta"><div class="day-item-cell"><span class="day-item-lbl">負責人</span><span class="day-item-val">${it.owner||'—'}</span></div></div>
        ${it.address?`<div style="display:flex;align-items:center;justify-content:space-between;gap:8px;"><span class="day-item-val" style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">📍 ${it.address}</span><button class="day-item-editbtn" onclick="openNav('${it.address.replace(/'/g,"\\'")}')">🧭 導航</button></div>`:''}
        ${it.note?`<div class="day-item-note">${it.note.replace(/\n/g,'<br>')}</div>`:''}
        <button class="day-item-editbtn" onclick="closeDayPanel();openEdit('${it.id}')">✏️ 編輯</button>
      </div>
    </div>`;
    }).join('');
  }
  document.getElementById('dayOverlay').classList.add('open');
};
window.closeDayPanel=(e)=>{ if(e && e.target!==document.getElementById('dayOverlay')) return; document.getElementById('dayOverlay').classList.remove('open'); };

window.switchView=(v)=>{
  currentView=v;
  document.getElementById('listView').style.display=v==='list'?'':'none';
  document.getElementById('calView').style.display=v==='cal'?'':'none';
  document.getElementById('vt-list').classList.toggle('active',v==='list');
  document.getElementById('vt-cal').classList.toggle('active',v==='cal');
  render();
};

window.markDone=async(id)=>{
  if(!FIREBASE_READY) return;
  try{ await updateDoc(doc(db,"users",currentUserId,"measurements",id),{status:'已完成',updatedAt:serverTimestamp()}); toast('✅ 已標記完成'); }
  catch{ toast('❌ 操作失敗'); }
};
window.deleteItem=async(id)=>{
  if(!confirm('確定刪除？'))return;
  if(!FIREBASE_READY) return;
  try{ await deleteDoc(doc(db,"users",currentUserId,"measurements",id)); toast('已刪除'); }
  catch{ toast('❌ 刪除失敗'); }
};

// ── modal + draft auto-save ──
function loadFormDraft(it){
  document.getElementById('f_name').value=it?.name||'';
  document.getElementById('f_address').value=it?.address||'';
  document.getElementById('driveTimeHint').textContent='';
  if(it?.address) updateDriveHint(it.address);
  document.getElementById('f_status').value=it?.status||'待安排';
  document.getElementById('f_owner').value=it?.owner||'';
  document.getElementById('f_date').value=it?.scheduledDate||'';
  document.getElementById('f_time').value=it?.scheduledTime||'';
  document.getElementById('f_note').value=it?.note||'';
  document.getElementById('f_operator').value=it?.operator||'';
  window.pickPurpose(it?.purpose||'丈量');
  onStatusChange();
}
window.openModal=(id=null)=>{
  editId=id;
  document.getElementById('modalTitle').textContent=id?'編輯行程':'新增待安排案場';
  if(id){
    loadFormDraft(items.find(x=>x.id===id));
  } else {
    if(draftData && draftData.editId===null){ loadFormDraft(draftData); }
    else { loadFormDraft(null); }
  }
  document.getElementById('modalOverlay').classList.add('open');
};
window.openEdit=id=>window.openModal(id);
window.closeModal=()=>{
  if(!editId){
    draftData={
      editId:null,
      name:document.getElementById('f_name').value,
      address:document.getElementById('f_address').value,
      purpose:selectedPurpose,
      status:document.getElementById('f_status').value,
      owner:document.getElementById('f_owner').value,
      scheduledDate:document.getElementById('f_date').value,
      scheduledTime:document.getElementById('f_time').value,
      note:document.getElementById('f_note').value,
      operator:document.getElementById('f_operator').value,
    };
    if(!draftData.name && !draftData.address && !draftData.note) draftData=null;
    if(draftData) localStorage.setItem('meastracker_draft_'+currentUserId, JSON.stringify(draftData));
    else localStorage.removeItem('meastracker_draft_'+currentUserId);
  }
  document.getElementById('modalOverlay').classList.remove('open');
  editId=null;
};

window.saveItem=async()=>{
  if(!FIREBASE_READY){ toast('⚠️ 尚未設定同步伺服器'); return; }
  const name=document.getElementById('f_name').value.trim(); if(!name){toast('請輸入名稱');return;}
  const status=document.getElementById('f_status').value;
  const data={
    name, status,
    purpose:selectedPurpose,
    address:document.getElementById('f_address').value.trim(),
    owner:document.getElementById('f_owner').value.trim(),
    scheduledDate: status==='待安排'?null:(document.getElementById('f_date').value||null),
    scheduledTime: status==='待安排'?null:(document.getElementById('f_time').value||null),
    note:document.getElementById('f_note').value.trim(),
    lastOperator:document.getElementById('f_operator').value.trim()||'未知',
    updatedAt:serverTimestamp(),
  };
  if(data.address && GOOGLE_MAPS_API_KEY){
    const r=await estimateDrive(data.address);
    if(r && !r.error){ data.driveDuration=r.duration; data.driveDistance=r.distance; }
  }
  try{
    if(editId){ await updateDoc(doc(db,"users",currentUserId,"measurements",editId),data); }
    else{ await addDoc(col,{...data,createdAt:serverTimestamp()}); }
    draftData=null; localStorage.removeItem('meastracker_draft_'+currentUserId);
    toast('✅ 已儲存');
    document.getElementById('modalOverlay').classList.remove('open');
    editId=null;
  }catch(e){ toast('❌ 儲存失敗'); console.error(e); }
};
